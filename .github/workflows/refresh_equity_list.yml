name: Refresh equity list

on:
  schedule:
    - cron: "0 2 * * 0"   # Sunday 07:30 IST
  workflow_dispatch:

concurrency:
  group: data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[pipeline]"
      - run: python -m pipeline.cli refresh-equity-list
        continue-on-error: true
      - run: python -m pipeline.cli refresh-index-membership
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: refresh equity list + index membership [skip ci]" && git pull --rebase && git push)
