name: Refresh fundamentals

on:
  schedule:
    - cron: "0 3 * * 6"   # Saturday 08:30 IST
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false

concurrency:
  group: data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~2,200 symbols across the combined universe; 20 shards of ~110 names each keeps a single
    # shard's yfinance.Ticker.info pacing (0.6s/symbol) comfortably under an hour.
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      matrix:
        shard: ["0/20", "1/20", "2/20", "3/20", "4/20", "5/20", "6/20", "7/20", "8/20", "9/20", "10/20", "11/20", "12/20", "13/20", "14/20", "15/20", "16/20", "17/20", "18/20", "19/20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[pipeline]"
      - run: python -m pipeline.cli refresh-fundamentals --shard "${{ matrix.shard }}" ${{ inputs.force == true && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: fundamentals shard ${{ matrix.shard }} [skip ci]" && git pull --rebase && git push)
