name: Refresh fundamentals

on:
  schedule:
    - cron: "0 3 * * 6"   # Saturday 08:30 IST
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false

concurrency:
  group: data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[pipeline]"
      - run: python -m pipeline.cli refresh-fundamentals --shard "${{ matrix.shard }}" ${{ inputs.force == true && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: fundamentals shard ${{ matrix.shard }} [skip ci]" && git pull --rebase && git push)
